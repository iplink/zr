<title id="title">Белый дом — первый этаж</title><desc id="desc">Обозначения на схеме: 1 — Кухня-гостиная; 2 — Вход и лестница на второй этаж; 3 — Гостевой санузел; 4 — Спальня; 5 — Основной санузел; 6 — Котельная. Гостевой санузел № 3 отделён перегородкой от входной зоны с лестницей № 2. Окна отмечены светлыми линиями, двери — дугами.</desc>
