<title id="title">Уединённый дом — первый этаж</title><desc id="desc">Обозначения на схеме: 1 — Угловая спальня; 2 — Спальня; 3 — Санузел; 4 — Кладовка котельной; 5 — Кухня-гостиная. Кухонное оборудование расположено вдоль правой стены кухни-гостиной, у окон. Окна отмечены светлыми линиями, двери — дугами.</desc>
