<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1610" viewBox="0 0 1200 1610" role="img" aria-labelledby="title desc" font-family="Arial,Helvetica,sans-serif" fill="#263f35">
<title id="title">Дом с баней — первый этаж</title><desc id="desc">Обозначения на схеме: 1 — Спальня; 2 — Комната отдыха; 3 — Прихожая; 4 — Санузел; 5 — Котельная; 6 — Душевая; 7 — Парная; 8 — Веранда; 9 — Банный чан. № 8 и 9 — веранда и чан на улице, показаны схематично. Котельная недоступна гостям. Окна отмечены светлыми линиями, двери — дугами.</desc>
